[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight137-eap"
version = "2.0.0"
description = "Entropy Attunement Protocol - 4D entropy profiling for behavioral prediction and AI safety"
readme = "README.md"
license = {text = "CC-BY-NC-ND-4.0"}
requires-python = ">=3.9"
authors = [
    {name = "Roger Yau", email = "roger@insight137.com"},
]
keywords = [
    "quantum cognition", "entropy", "behavioral prediction",
    "AI safety", "Deng entropy", "interference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://insight137.com"
Research = "https://insight137.com/research"
Repository = "https://github.com/Insight137/insight137-eap"
Issues = "https://github.com/Insight137/insight137-eap/issues"

[tool.setuptools]
py-modules = ["insight137_eap"]
